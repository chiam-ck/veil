# Optional file-based provider credential. The host file must remain private.
services:
  veil-api:
    environment:
      VEIL_LLM_API_KEY: ""
      VEIL_LLM_API_KEY_FILE: /run/secrets/llm_api_key
    secrets: [llm_api_key]
  veil-worker:
    environment:
      VEIL_LLM_API_KEY: ""
      VEIL_LLM_API_KEY_FILE: /run/secrets/llm_api_key
    secrets: [llm_api_key]
secrets:
  llm_api_key:
    file: ${VEIL_LLM_SECRET_FILE:-./secrets/llm_api_key}
